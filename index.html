<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALMAX GETKEY</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050811;color:#eaf3ff;font-family:Arial,sans-serif;display:grid;place-items:center}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,#087cff25,transparent 45%);pointer-events:none}
.card{width:min(440px,92vw);padding:30px;border:1px solid #168cff66;border-radius:22px;background:#080e19ee;box-shadow:0 0 50px #0077ff18;text-align:center}
.badge{color:#52b5ff;border:1px solid #168cff66;border-radius:999px;padding:6px 11px;font-size:11px;letter-spacing:2px;display:inline-block}
h1{font-size:38px;letter-spacing:4px;margin:12px 0 4px}h1 span{color:#2fa8ff}.sub{color:#7f91aa;font-size:13px;margin-bottom:24px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #26384f;background:#050913;color:#fff;outline:none;margin-bottom:10px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#168cff;color:#fff;font-weight:bold;cursor:pointer;margin-bottom:10px}
button.alt{background:#101a2a;border:1px solid #28415e}.msg{height:25px;color:#68dfa0;font-size:13px}.stats{display:flex;gap:10px;margin-top:15px}.stat{flex:1;border:1px solid #1d3048;border-radius:12px;padding:11px}.n{font-size:18px}.l{font-size:10px;color:#71839c;margin-top:3px}.foot{margin-top:20px;color:#506078;font-size:10px}
</style></head>
<body><main class="card">
<div class="badge">ONLINE KEY SYSTEM</div><h1>REAL<span>MAX</span></h1><div class="sub">GET KEY • VERIFY • LICENSE</div>
<input id="key" placeholder="REAL-XXXX-XXXX-XXXX">
<button onclick="getKey()">GET FREE KEY</button>
<button class="alt" onclick="verifyKey()">VERIFY KEY</button>
<div id="msg" class="msg"></div>
<div class="stats"><div class="stat"><div id="total" class="n">-</div><div class="l">TOTAL KEYS</div></div><div class="stat"><div id="active" class="n">-</div><div class="l">ACTIVE</div></div></div>
<div class="foot">REALMAX KEY SYSTEM • ONLINE</div>
</main>
<script>
async function getKey(){
 const r=await fetch('/api/getkey',{method:'POST'}); const d=await r.json();
 document.getElementById('key').value=d.key;
 msg('✓ สร้าง KEY สำเร็จ • อายุ 1 วัน',true); stats();
}
async function verifyKey(){
 const key=document.getElementById('key').value;
 const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
 const d=await r.json(); msg(d.ok?'✓ '+d.message:'✕ '+d.message,d.ok);
}
function msg(t,ok){const e=document.getElementById('msg');e.textContent=t;e.style.color=ok?'#68dfa0':'#ff7373'}
async function stats(){const d=await (await fetch('/api/stats')).json();total.textContent=d.total;active.textContent=d.active}
stats();
</script></body></html>
